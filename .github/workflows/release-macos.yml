name: macOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sign-release:
    runs-on: macos-15
    env:
      MACOS_SIGNING_CERT_BASE64: ${{ secrets.MACOS_SIGNING_CERT_BASE64 }}
      MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Import Developer ID certificate
        if: env.MACOS_SIGNING_CERT_BASE64 != ''
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERT_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/grok-switch.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/grok-switch.p12"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          security import "$CERTIFICATE" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$RUNNER_TEMP" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Configure notarization credentials
        if: env.MACOS_SIGNING_CERT_BASE64 != '' && env.MACOS_NOTARY_KEY_BASE64 != ''
        env:
          NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          NOTARY_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$NOTARY_KEY"
          xcrun notarytool store-credentials grok-switch-ci \
            --key "$NOTARY_KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          printf 'APPLE_NOTARY_PROFILE=grok-switch-ci\n' >> "$GITHUB_ENV"

      - name: Build signed release
        if: env.MACOS_SIGNING_CERT_BASE64 != ''
        env:
          VERSION: ${{ github.ref_name }}
        run: ./build-macos.sh --require-signature

      - name: Build unsigned fallback
        if: env.MACOS_SIGNING_CERT_BASE64 == ''
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          echo '::warning::No Developer ID certificate is configured; publishing an unsigned macOS build.'
          ./build-macos.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: grok-switch-macos-arm64
          path: |
            dist/macos/*.dmg
            dist/macos/*.sha256
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/macos/*.dmg dist/macos/*.sha256 --clobber
